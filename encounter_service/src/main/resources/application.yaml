spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:9092
    topic:
      monster: monster
      monster-group: monster-group
  jpa:
    hibernate:
      ddl-auto: update

game:
  monster:
    creation:
      max-monsters: 10
      diversity: 1
server:
  port : 8081
